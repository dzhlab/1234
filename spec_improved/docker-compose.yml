version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: rgsystem_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-rgsystem_db}
      POSTGRES_USER: ${DB_USER:-rgsystem_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ru_RU.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - rgsystem_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rgsystem_user} -d ${DB_NAME:-rgsystem_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rgsystem_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisPassword123!} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - rgsystem_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server (Backend)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-18}
    container_name: rgsystem_api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3000}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rgsystem_db}
      DB_USER: ${DB_USER:-rgsystem_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPassword123!}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretJWTKey123!ChangeThisInProduction}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # API Settings
      API_RATE_LIMIT: ${API_RATE_LIMIT:-1000}
      API_RATE_WINDOW: ${API_RATE_WINDOW:-3600000}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rgsystem_network
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WebSocket Server
  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    container_name: rgsystem_websocket
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WS_PORT:-3001}

      # Redis for pub/sub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPassword123!}

      # JWT for authentication
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretJWTKey123!ChangeThisInProduction}

      # WebSocket settings
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-30000}
      WS_PING_TIMEOUT: ${WS_PING_TIMEOUT:-5000}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-1000}

    ports:
      - "${WS_PORT:-3001}:3001"
    depends_on:
      - redis
    networks:
      - rgsystem_network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rgsystem_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
      - websocket
    networks:
      - rgsystem_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adminer (Database Management - optional, for development)
  adminer:
    image: adminer:latest
    container_name: rgsystem_adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - postgres
    networks:
      - rgsystem_network
    restart: unless-stopped
    profiles:
      - dev

  # Redis Commander (Redis Management - optional, for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rgsystem_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-RedisPassword123!}
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - rgsystem_network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  rgsystem_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
